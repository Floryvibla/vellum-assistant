server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location = / {
    return 302 /assistant/;
  }

  location = /assistant/runtime-config.js {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location ~ ^/(v1|_allauth|accounts|healthz|readyz|schema|webhooks|deliver) {
    proxy_pass http://gateway:7830;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Vellum-Edge-Forwarded "1";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
  }

  location /assistant/ {
    try_files $uri $uri/ /assistant/index.html;
  }
}
